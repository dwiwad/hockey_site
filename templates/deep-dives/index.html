<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Analytics -->
    <script async 
    src="https://www.googletagmanager.com/gtag/js?id=G-NJ7PYMV7SS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-NJ7PYMV7SS');
    </script>
    <title>Deep Dives | Hockey Decoded</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="site-nav-header">
        <div class="nav-container">
            <div class="site-title"><a href="/">Hockey Decoded</a></div>

            <!-- Hamburger menu button (only visible on mobile) -->
            <button class="hamburger" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="site-nav">
                <a href="/">Home</a>
                <a href="/deep-dives">Deep Dives</a>
                <a href="/dashboard">Dashboards</a>
                <a href="/about">About</a>
            </nav>
        </div>    
    </header>
    
    <main class="blog-card-row">        
        {% for post in posts %}
        <a href="/deep-dives/{{ post.slug }}" class="blog-card-wrapper">
            <div class="blog-card">
                {% if post.image %}
                <img class="blog-card-image" src="{{ post.image }}" alt="{{ post.title }}">
                {% endif %}

                <div class="blog-card-content">
                    <div class="blog-card-meta">
                        <span class="blog-tag">{{ post.tag }}</span>
                        <span class="blog-date">{{ post.date_str }}</span>
                    </div>

                    <h2 class="blog-card-title">{{ post.title }}</h2>

                    {% if post.summary %}
                    <p class="blog-card-summary">{{ post.summary }}</p>
                    {% endif %}

                    <span class="blog-card-link">Read more →</span>
                </div>
            </div>
        </a>
        {% endfor %}
    </main>

    <script>
    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function() {
      const hamburger = document.querySelector('.hamburger');
      const nav = document.querySelector('.site-nav');

      if (hamburger) {
        hamburger.addEventListener('click', function() {
          hamburger.classList.toggle('active');
          nav.classList.toggle('active');
        });
      }
    });
    </script>

</body>

</html>
