<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboards | Hockey Decoded</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="site-nav-header">
        <div class="nav-container">
            <div class="site-title"><a href="/">Hockey Decoded</a></div>
           <nav class="site-nav">
                <a href="/">Home</a>
                <a href="/deep-dives">Deep Dives</a>
                <a href="/dashboard">Dashboards</a>
                <a href="/about">About</a>
            </nav>
          </div>    
    </header>
    
    <main class="sub-main">
        <h1>Games Today</h1>
        <h3>{{ pretty_date }}</h3>

        <section class="game-card-row">
            {% if games_today %}
                {% for game in games_today %}
                    <article class="game-card">
                        <div class="game-card-body">
                            <!-- Left logo -->
                            <img class="team-logo"
                                src="/static/images/logos/{{ game.away_tri|upper }}_light.svg"
                                alt="{{ game.away }} logo">

                            <!-- Center stack -->
                            <div class="center-stack">
                                <h2 class="matchup">{{ game.away }} <span style="font-size:16px;">AT</span> {{ game.home }}</h2>
                                <h3 class="start">{{ game.start }}</h3>
                                <button class="game-button"><a href="/dashboard/games/{{ game.season }}/{{ game.game_id }}">Open dashboard</a></button>
                            </div>

                            <!-- Right logo -->
                            <img class="team-logo"
                                src="/static/images/logos/{{ game.home_tri|upper }}_light.svg"
                                alt="{{ game.home }} logo">
                        </div>
                    </article>
                {% endfor %}
            {% else %}
                <h2>No games scheduled for today.</h2>
            {% endif %}
        </section>

        <div style="padding:0 24px 80px;">
            <div style="max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;">
                <button class="game-button"><a href="/dashboard?date={{ prev_day }}">Yesterday's Games</a></button>

                <form action="/dashboard" method="get" style="display:flex;align-items:center;gap:10px;">
                    <input type="date" id="myDate" name="date">
                    <button type="submit">Go</button>
                </form>
                
                <button class="game-button"><a href="/dashboard?date={{ next_day }}">Tomorrow's Games</a></button>
            </div>
        </div>


        <!-- <h1>Static Dashboards</h1> -->
            <!-- I might want static or historical dashboards to be below but that sort of goes against the clean design philosophy. Link to elsewhere? --> 
    </main>
</body>

</html>
