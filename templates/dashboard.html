<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboards | Hockey Decoded</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="site-nav-header">
        <div class="nav-container">
            <div class="site-title"><a href="/">Hockey Decoded</a></div>
           <nav class="site-nav">
                <a href="/">Home</a>
                <a href="/deep-dives">Deep Dives</a>
                <a href="/dashboard">Dashboards</a>
                <a href="/about">About</a>
            </nav>
          </div>    
    </header>
    
    <main class="sub-main">
        <h1>Games Today</h1>

        <section class="todays-games">
            {% if games_today %}
                <ul>
                    {% for game in games_today %}
                        <li>
                            <div>{{ game.away }} @ {{ game.home }}</div>
                            <div>{{ game.start }}</div>
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p>No games scheduled for today.</p>
            {% endif %}
        </section>
    </main>
</body>

</html>
